# Elastic Load Balancer health checks use the instance IP as Host. Proxy the
# dedicated liveness path with the deployed API host so Django can still verify
# the database rather than returning a false DisallowedHost response.
location = /healthz {
    proxy_set_header Host api.sportspot.deepak-shrestha.com.np;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8000/api/health/;
}
